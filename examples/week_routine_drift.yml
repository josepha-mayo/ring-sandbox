# Custom scenario for `ring-sandbox play` / `attest replay`.
#
# One week of an older person who lives alone, seen only at the front of the
# house: the doorbell ("Front Door"), its contact sensor ("Front Door Sensor")
# and the garden camera ("Backyard"). The built-in scenarios cover single
# visits; this one is for apps that learn a household's routine over several
# days and flag slow change against it:
#   - days 1-3 are the baseline: she steps out for the paper around 07:15,
#     goes to the shops mid-morning, is in the garden after lunch and takes
#     an afternoon walk
#   - days 4-7 drift: each first door opening comes later (07:55 -> 08:55),
#     the afternoon walk stops and the morning trip gets shorter
#   - day 6 is a quiet morning: nothing at all until 12:35 and no trip out,
#     so a "no morning activity" check should fire, then clear when she
#     appears
# A trip out is door open -> close -> doorbell motion; coming home is
# doorbell motion -> door open -> close.
#
# Offsets are seconds from 00:00 on day 1 (86400 per day). `play` puts the
# last step just before now, so wall-clock times shift with the run; pass
# `start=` to `ring_sandbox.scenarios.run()` to pin day 1 to a real midnight.
# Try:  ring-sandbox play week_routine_drift --backdate
#   or  ring-sandbox play week_routine_drift --speed 3600   (about 2.6 minutes)
# Field reference: see late_arrival.yml / ring_sandbox.scenarios.Step.
# Contributed by Jirani (https://github.com/youneedgreg/Jirani), whose test
# data comes from ring-routine-sim (https://github.com/youneedgreg/ring-routine-sim),
# a generator for multi-week routines like this one.

name: week_routine_drift
description: >-
  A week of one person's routine at the front door: three baseline days, then
  later mornings, fewer trips out and one quiet morning.

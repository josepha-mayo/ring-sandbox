# Custom scenario for `ring-sandbox play` / `attest replay`.
#
# One compressed day at a small neighbourhood shop, seen by two cameras in the
# default world: "Front Door" watches customers come in, "Backyard" stands in
# for the back-door loading lane. Useful for apps that count footfall and log
# supplier deliveries:
#   - staff arrive before opening and leave after closing
#   - a morning rush and a denser lunch peak at the front door
#   - three deliveries at the back (vehicle -> courier on foot -> vehicle):
#     an on-time bread van, an on-time produce pickup, and a drinks lorry
#     that turns up late, in the middle of the lunch peak
#   - a cat in the back lane (motion with no sub_type) that is NOT a delivery
#
# Offsets are seconds from 06:45. Try:  ring-sandbox play shop_day --speed 600
# Field reference: see late_arrival.yml / ring_sandbox.scenarios.Step.
# Contributed by ShopSense (https://github.com/ZenBen5173/shopsense).

name: shop_day
description: >-
  A small shop's day on two cameras: morning rush, lunch peak, and three
  back-door deliveries (two on time, one late into the lunch peak).
steps:
